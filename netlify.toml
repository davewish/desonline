[build]
  base = "frontend"
  command = "npm ci --production=false && npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  NODE_ENV = "production"
  VITE_API_URL = "https://desonline-production.up.railway.app/api"

[context.deploy-preview.environment]
  NODE_ENV = "production"
  VITE_API_URL = "https://desonline-production.up.railway.app/api"
