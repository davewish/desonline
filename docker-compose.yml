version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: desonline-db
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-desonline}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - desonline-network
    restart: unless-stopped

  # Express Backend API - Development Mode
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: desonline-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres123}@postgres:5432/${DATABASE_NAME:-desonline}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-12345}
      PORT: 5000
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-52428800}
    ports:
      - "5555:5000"
    volumes:
      # Mount source code for live changes
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
      # Exclude node_modules to use container's version
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - desonline-network
    restart: on-failure
    # Run npm dev directly
    command: npm run dev
    stdin_open: true
    tty: true

  # pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: desonline-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@desonline.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - desonline-network
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  desonline-network:
    driver: bridge
